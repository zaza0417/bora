# Sobe só a Evolution (WhatsApp) para desenvolvimento local, na porta 8081
# (a 8080 costuma estar ocupada). Uso:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file .env.local \
#     up -d evolution evolution-db evolution-redis
services:
  evolution:
    ports: ["8081:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
