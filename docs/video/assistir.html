<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Bora — tour em vídeo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 40px 22px; font-family: system-ui, sans-serif; background: #fbfbfd; color: #1d1d1f;
      display: grid; gap: 40px; justify-items: center; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
    h1 { margin: 0; font-size: 2rem; letter-spacing: -0.03em; }
    .linha { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
    figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
    figcaption { color: #6e6e73; font-size: .9rem; }
    video { border-radius: 18px; box-shadow: 0 20px 60px rgb(0 0 0 / 18%); background: #000; }
    .pc { width: min(900px, 92vw); }
    .cel { width: 300px; border-radius: 36px; }
  </style>
</head>
<body>
  <h1>Bora em ação</h1>
  <div class="linha">
    <figure>
      <video class="pc" src="bora-computador.webm" controls autoplay muted loop playsinline></video>
      <figcaption>Organizador: página inicial, painel do evento, formulário e ajustes</figcaption>
    </figure>
    <figure>
      <video class="cel" src="bora-celular.webm" controls autoplay muted loop playsinline></video>
      <figcaption>Convidado: o convite, o “Vou!” e o PIX</figcaption>
    </figure>
  </div>
</body>
</html>
