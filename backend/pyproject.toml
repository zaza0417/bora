[project]
name = "bora-backend"
version = "0.1.0"
description = "Backend do Bora (FastAPI)"
authors = [
    { name = "IsacAlves", email = "isac.carmo@singletech.com.br" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "holidays>=0.108",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.43",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=7.0.1",
    "pytesseract>=0.3.13",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
